    <rect width="64" height="66" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="32" y="32" font-size="12" fill="#4F46E5" font-weight="700" font-family="'Fira Code', monospace" text-anchor="middle">MILK</text>
    <text x="32" y="48" font-size="9" fill="#64748B" font-family="'Fira Code', monospace" text-anchor="middle">wave</text>
  </g>

  <!-- Right: Project Details -->
  <text x="90" y="50" font-size="15" fill="#0F172A" font-weight="700">MilkyWave</text>
  <text x="90" y="66" font-size="11" fill="#4F46E5" font-weight="600">Local Commerce &amp; Delivery Platform</text>
  <text x="90" y="82" font-size="9.5" fill="#64748B" font-family="'Fira Code', monospace">React Native &#183; Expo &#183; TypeScript &#183; Supabase &#183; Razorpay</text>
  
  <!-- Metric chips -->
  <rect x="90" y="93" width="138" height="18" rx="3" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="96" y="105.5" font-size="9" fill="#4F46E5" font-weight="600" font-family="'Fira Code', monospace">Razorpay API Checkout</text>
  
  <rect x="235" y="93" width="145" height="18" rx="3" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="241" y="105.5" font-size="9" fill="#059669" font-weight="600" font-family="'Fira Code', monospace">Real-time Order State</text>
