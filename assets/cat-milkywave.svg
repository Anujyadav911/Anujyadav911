<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="130" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadowMw" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="396" height="126" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadowMw)" />
  
  <!-- Clean Titlebar -->
  <path d="M 2 8 Q 2 2 8 2 L 392 2 Q 398 2 398 8 L 398 26 L 2 26 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
  <circle cx="14" cy="14" r="3.5" fill="#EF4444" />
  <circle cx="24" cy="14" r="3.5" fill="#F59E0B" />
  <circle cx="34" cy="14" r="3.5" fill="#10B981" />
  <text x="46" y="17" font-size="10" fill="#64748B" font-family="'Fira Code', monospace">milkywave.app &#8212; [MOBILE APP]</text>
  
  <!-- Downloads Badge -->
  <rect x="275" y="6" width="116" height="16" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="333" y="17.5" font-size="9" fill="#4F46E5" font-weight="700" font-family="'Fira Code', monospace" text-anchor="middle">100+ DOWNLOADS</text>

  <!-- Left: Mini Branded Emblem -->
