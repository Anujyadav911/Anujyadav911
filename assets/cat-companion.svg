<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="220" style="background: transparent; font-family: 'Fira Code', 'Courier New', Courier, monospace;">
  <defs>
    <filter id="pinkGlowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pink-cat-body {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      fill: #FF75A0;
      font-weight: bold;
      filter: url(#pinkGlowAbout);
    }
    @keyframes earWiggle {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-3deg); }
      96% { transform: rotate(2deg); }
    }
    .cat-group {
      transform-origin: 120px 100px;
      animation: earWiggle 5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="236" height="216" rx="10" fill="#1A1020" stroke="#3D2033" stroke-width="1.2" />

  <!-- Titlebar -->
  <path d="M 2 10 Q 2 2 10 2 L 230 2 Q 238 2 238 10 L 238 28 L 2 28 Z" fill="#251624" />
  <circle cx="16" cy="15" r="4" fill="#FF75A0" />
  <circle cx="28" cy="15" r="4" fill="#FFB3C6" />
  <circle cx="40" cy="15" r="4" fill="#5AF78E" />
  <text x="52" y="19" font-size="11" fill="#FFB3C6" font-weight="600">neko_companion.sh 🐾</text>

  <!-- Cat ASCII exact match from reference -->
  <g class="cat-group">
    <text x="75" y="68" class="pink-cat-body" xml:space="preserve">  /|､</text>
    <text x="75" y="92" class="pink-cat-body" xml:space="preserve">(°､ ｡ 7</text>
    <text x="75" y="116" class="pink-cat-body" xml:space="preserve"> |､  ~ \</text>
    <text x="75" y="140" class="pink-cat-body" xml:space="preserve"> じし_,)ノ</text>
  </g>

  <!-- Tag below Cat -->
  <rect x="30" y="165" width="180" height="26" rx="6" fill="#2D1424" stroke="#FF75A0" stroke-width="1" />
  <text x="120" y="182" font-size="11.5" fill="#FF75A0" font-weight="bold" text-anchor="middle">ฅ^•ﻌ•^ฅ purring at 60fps</text>
</svg>